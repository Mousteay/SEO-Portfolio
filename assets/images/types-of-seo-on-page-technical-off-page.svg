<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Three types of SEO</title>
<desc id="desc">On-page, technical, and off-page SEO</desc>
<rect width="1200" height="675" rx="28" fill="#f5f7f6"/>
<rect x="55" y="55" width="1090" height="565" rx="24" fill="#ffffff" stroke="#d9e1dc" stroke-width="3"/>

<text x="105" y="120" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#18382c">Three overlapping areas of SEO</text>
<circle cx="430" cy="340" r="155" fill="#eef3f0" stroke="#1f5c45" stroke-width="5"/>
<circle cx="690" cy="340" r="155" fill="#f1f5f3" stroke="#2f765b" stroke-width="5"/>
<circle cx="560" cy="475" r="155" fill="#f7f9f8" stroke="#1f5c45" stroke-width="5"/>
<text x="352" y="330" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#18382c">On-page</text>
<text x="345" y="362" font-family="Arial, sans-serif" font-size="18" fill="#52665c">Content</text>
<text x="617" y="330" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#18382c">Technical</text>
<text x="620" y="362" font-family="Arial, sans-serif" font-size="18" fill="#52665c">Crawlability</text>
<text x="500" y="478" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#18382c">Off-page</text>
<text x="505" y="510" font-family="Arial, sans-serif" font-size="18" fill="#52665c">Links</text>

</svg>