<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Jobs created and displaced by 2030</title>
  <desc id="desc">Illustration comparing projected jobs displaced and jobs created</desc>
  <rect width="1200" height="675" rx="28" fill="#f5f7f6"/>
  <rect x="55" y="55" width="1090" height="565" rx="24" fill="#ffffff" stroke="#d9e1dc" stroke-width="3"/>
  
  <text x="115" y="130" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#18382c">Projected labor-market churn by 2030</text>
  <rect x="170" y="225" width="370" height="190" rx="18" fill="#eef3f0" stroke="#1f5c45" stroke-width="4"/>
  <rect x="660" y="165" width="390" height="250" rx="18" fill="#eef3f0" stroke="#1f5c45" stroke-width="4"/>
  <text x="205" y="280" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#18382c">Jobs displaced</text>
  <text x="205" y="365" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#1f5c45">92M</text>
  <text x="695" y="220" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#18382c">Jobs created</text>
  <text x="695" y="330" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#1f5c45">170M</text>
  <text x="170" y="485" font-family="Arial, sans-serif" font-size="24" fill="#52665c">Net projection: 78M additional roles</text>

</svg>